  <script>
  /* 作品详情渲染：读 ?id=，从 SITE_CONTENT 找到对应作品 */
  (function () {
    var C = window.SITE_CONTENT;
    var id = new URLSearchParams(location.search).get('id');
    var box = document.getElementById('wd-head');
    var media = document.getElementById('wd-media');
    var body = document.getElementById('wd-body');
    var list = (C && C.collections && C.collections.works) || [];
    var w = null;
    for (var i = 0; i < list.length; i++) if (list[i].id === id) { w = list[i]; break; }

    function esc(s) {
      return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;')
        .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function platformLabel(src) {
      if (!src) return '点击在线观看';
      if (/\.mp4(\?|$)/i.test(src)) return '点击在线播放';
      if (/douyin\.com|iesdouyin/i.test(src)) return '点击前往抖音观看';
      if (/weixin\.qq\.com|channels\.weixin/i.test(src)) return '点击前往视频号观看';
      if (/bilibili/i.test(src)) return '点击在线观看 · B 站';
      return '点击在线观看';
    }
    if (!w) {
      box.innerHTML = '<h1 style="margin-top:24px">作品不存在或已下架</h1>';
      return;
    }
    document.title = (w.title || '作品详情') + ' · 熊俊';
    var md = document.querySelector('meta[name="description"]');
    if (md && w.desc) md.setAttribute('content', w.desc);

    box.innerHTML =
      '<div class="wd-meta">' +
        '<span class="tag">' + esc(w.cat || '') + '</span>' +
        '<span class="wd-time">' + esc(w.publishedAt || '') + '</span>' +
        '<span class="wd-views">' + Number(w.views || 0) + ' 次浏览</span>' +
      '</div>' +
      '<h1>' + esc(w.title || '未命名作品') + '</h1>' +
      (w.desc ? '<p class="wd-desc">' + esc(w.desc) + '</p>' : '');

    /* 外链 H5（易企秀等）：iframe 内嵌，100% 保真 */
    if (w.embedUrl) {
      media.innerHTML =
        '<div class="wd-embed-wrap"><iframe src="' + esc(w.embedUrl) + '" loading="lazy" ' +
        'allow="autoplay; fullscreen; encrypted-media; picture-in-picture" allowfullscreen ' +
        'referrerpolicy="no-referrer"></iframe>' +
        '<p class="wd-embed-tip">若内嵌无法显示（部分平台禁止被嵌入），<a target="_blank" rel="noopener" href="' + esc(w.embedUrl) + '">点此在新窗口打开 ↗</a></p></div>';
    } else if (w.kind === 'video' && w.videoSrc) {
      media.innerHTML =
        '<div class="video-slot is-detail">' +
        '<button class="video-facade" type="button" data-video-src="' + esc(w.videoSrc) + '" aria-label="' + esc(platformLabel(w.videoSrc)) + '：' + esc(w.title) + '">' +
        (w.cover ? '<img class="facade-img" src="' + esc(w.cover) + '" alt="" loading="lazy">' : '') +
        '<span class="play-btn" aria-hidden="true"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M8 5.5v13l11-6.5z"/></svg></span>' +
        '<span class="facade-txt"><b>' + esc(w.title) + '</b><span>' + esc(platformLabel(w.videoSrc)) + '</span></span>' +
        '</button></div>';
    }

    if (w.kind === 'article' && w.content) {
      body.innerHTML = '<div class="article-body">' + w.content + '</div>';
      /* 秀米/易企秀图床有 Referer 防盗链：全部图片改为不发送 Referer */
      body.querySelectorAll('img').forEach(function (im) { im.setAttribute('referrerpolicy', 'no-referrer'); });
      /* 兜底：未填地址的空视频占位不展示 */
      body.querySelectorAll('.video-facade[data-video-src=""]').forEach(function (f) {
        var s = f.closest('.video-slot'); (s || f).remove();
      });
    } else if (!w.embedUrl && w.kind !== 'video') {
      body.innerHTML = '<div class="article-body"><p style="opacity:.4">（正文为空，请在后台编辑）</p></div>';
    }
  })();
  </script>
  <script>
  /* 秀米轮换组件交互协调：X 返回 / 照片展开 的视觉层显示控制。
     SMIL 的返回动画只作用于交互层，视觉层（交替页图片）不随之移动，需 JS 兜底同步。 */
  (function () {
    /* 秀米轮换组件交互协调（增强版）：
       - 纯 show 型组件（朋友圈图集类，无 trigger-area-to-hide）：JS 完全接管。
         移除全部 SMIL 动画（SMIL 的 fill/freeze 状态在手机上不还原，会把列表层压扁/位移，
         CSS 无法覆盖，导致照片第二次点击失效），展开/收起改用 visibility 控制，状态永不残留。
       - trigger 型组件（work-02 诗词比拼类）：保留原有 display + resetList 逻辑。 */
    var hidden = null;
    /* 接管纯 show 型组件 */
    try {
      document.querySelectorAll('.xiumi-canvas').forEach(function (canvas) {
        var hasHide = canvas.querySelector('rect[class*="trigger-area-to-hide"]');
        var pops = canvas.querySelectorAll('svg.alternated-page');
        if (hasHide || !pops.length) return;
        canvas.querySelectorAll('animate, animateTransform, set').forEach(function (el) { el.remove(); });
        pops.forEach(function (p) { p.style.visibility = 'hidden'; });
        canvas.setAttribute('data-js-driven', '1');
      });
    } catch (e) {}
    function findVis(r) {
      var canvas = r.closest('.xiumi-canvas');
      if (!canvas) return null;
      var xr = r.getBoundingClientRect();
      var vis = canvas.querySelectorAll('svg.alternated-page svg.svg-content');
      var best = null, bestD = 1e9;
      vis.forEach(function (v) {
        var vr = v.getBoundingClientRect();
        if (vr.width === 0) return;
        var d = Math.hypot(vr.left - xr.left, vr.top - xr.top);
        if (d < bestD) { bestD = d; best = v; }
      });
      if (!best) return null;
      var c = best.closest('svg.alternated-page');
      return c || best;
    }
    function resetList(canvas) {
      var la = canvas.querySelector('svg.alternate-animation-placeholder.non-alternated-page');
      if (!la) return;
      la.style.transform = 'none';
      la.style.height = 'auto';
      la.style.opacity = '';
      /* 四张照片的触发区父 g 都可能被 SMIL 动画位移，必须全部复位 */
      var gs = canvas.querySelectorAll('rect[class*="trigger-area-to-show"]');
      gs.forEach(function (g) { g.parentElement.style.transform = 'none'; });
      /* 弹窗页容器复位：位移/透明度残留一并清掉 */
      canvas.querySelectorAll('svg.alternated-page').forEach(function (p) {
        if (p.style.display !== 'none') p.style.transform = '';
        p.style.opacity = '';
      });
    }
    document.addEventListener('click', function (e) {
      var t = e.target;
      if (!t || !t.closest) return;
      var cx = e.clientX || 0, cy = e.clientY || 0;
      /* ① 全局 × 区域判定：视觉 × 与触发 rect 错位 + 该位置无 rect 覆盖会穿透到下层，
         不依赖 e.target，直接遍历画布内所有可见弹窗容器，按真实坐标命中右上角 → 返回 */
      var canvases = document.querySelectorAll('.xiumi-canvas');
      var hitPop = null, hitCanvas = null;
      for (var ci = 0; ci < canvases.length; ci++) {
        var ccx = canvases[ci];
        if (getComputedStyle(ccx).display === 'none') continue;
        var pops = ccx.querySelectorAll('svg.alternated-page');
        for (var pi = 0; pi < pops.length; pi++) {
          var pp = pops[pi];
          if (getComputedStyle(pp).display === 'none') continue;
          if (getComputedStyle(pp).visibility === 'hidden') continue;
          var pr = pp.getBoundingClientRect();
          if (cx > pr.right - 80 && cx < pr.right + 20 && cy > pr.top - 20 && cy < pr.top + 150) {
            hitPop = pp; hitCanvas = ccx; break;
          }
        }
        if (hitPop) break;
      }
      if (hitPop) {
        hidden = hitPop;
        if (hitCanvas && hitCanvas.getAttribute('data-js-driven') === '1') {
          hitCanvas.querySelectorAll('svg.alternated-page').forEach(function (p) { p.style.visibility = 'hidden'; p.style.transform = ''; });
        } else {
          hitPop.style.display = 'none';
          if (hitCanvas) resetList(hitCanvas);
        }
        return;
      }
      /* ② 弹窗内其它位置 → 保持弹窗不动（不响应列表逻辑） */
      if (t.closest('svg.alternated-page')) return;
      /* ③ 列表层：照片展开触发区 */
      var r = t.closest('rect');
      if (!r || getComputedStyle(r).pointerEvents === 'none') return;
      var g = r.parentElement;
      if (!g || !g.getAttribute) return;
      /* 秀米触发类名可能挂在 rect 自身或父 g 上，两者都纳入判断 */
      var cls = ((g.getAttribute('class') || '') + ' ' + (r.getAttribute('class') || '')).trim();
      if (cls.indexOf('trigger-area-to-hide-alternated-page') >= 0) {
        var c = r.closest('.xiumi-canvas');
        if (c && c.getAttribute('data-js-driven') === '1') {
          c.querySelectorAll('svg.alternated-page').forEach(function (p) { p.style.visibility = 'hidden'; p.style.transform = ''; });
        } else {
          var v = r.closest('svg.alternated-page') || findVis(r);
          if (v) { hidden = v; v.style.display = 'none'; }
          if (c) resetList(c);
        }
      } else if (cls.indexOf('trigger-area-to-show-alternated-page') >= 0) {
        var canvas = r.closest('.xiumi-canvas');
        var target = null;
        /* 第 N 张照片 ↔ 第 N 个弹窗页（DOM 顺序一一对应），不能复用上一张记忆的页 */
        if (canvas) {
          var shows = canvas.querySelectorAll('rect[class*="trigger-area-to-show"]');
          var idx = -1;
          for (var si = 0; si < shows.length; si++) if (shows[si] === r) { idx = si; break; }
          var pages = canvas.querySelectorAll('svg.alternated-page');
          if (idx >= 0 && idx < pages.length) target = pages[idx];
        }
        if (!target) target = hidden || findVis(r);
        if (canvas && canvas.getAttribute('data-js-driven') === '1') {
          /* 接管组件：显示目标弹窗页（移到列表层位置），隐藏其它页 */
          canvas.querySelectorAll('svg.alternated-page').forEach(function (p) { p.style.visibility = 'hidden'; p.style.transform = ''; });
          if (target) {
            var anchor = canvas.querySelector('svg.alternate-animation-placeholder') || canvas.querySelector('svg.svg-content') || canvas;
            var ar = anchor.getBoundingClientRect();
            var pr2 = target.getBoundingClientRect();
            if (pr2.width > 0 && (Math.abs(pr2.left - ar.left) > 2 || Math.abs(pr2.top - ar.top) > 2)) {
              target.style.transform = 'translate(' + (ar.left - pr2.left) + 'px,' + (ar.top - pr2.top) + 'px)';
            }
            target.style.visibility = 'visible';
          }
          hidden = null;
        } else {
          if (target) target.style.display = '';
          if (canvas) resetList(canvas);
          hidden = null;
        }
      }
    }, true);
  })();
  </script>

  <!-- 分享组件：复制链接 / 微信二维码 / 系统分享 -->
  <div id="wd-share" class="wd-share" aria-live="polite">
    <button class="wd-share-btn" type="button" aria-label="分享作品" title="分享作品">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v7a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-7"/><path d="M16 6l-4-4-4 4"/><path d="M12 2v13"/></svg>
    </button>
    <div class="wd-share-panel" hidden>
      <div class="wd-share-acts">
        <button type="button" class="wd-share-act" data-share="copy">复制链接</button>
        <button type="button" class="wd-share-act" data-share="qrcode">二维码</button>
        <button type="button" class="wd-share-act" data-share="system" hidden>系统分享</button>
      </div>

    </div>
  </div>
  <!-- 作品二维码弹层：中央大图，长按识别/保存，点空白退回 -->
  <div class="qr-modal" id="wd-qr-modal" aria-hidden="true">
    <div class="qr-backdrop" data-qr-close></div>
    <div class="qr-card glass" role="dialog" aria-modal="true" aria-label="作品二维码">
      <button class="qr-close icon-btn" type="button" data-qr-close aria-label="关闭二维码">
        <svg viewBox="0 0 24 24" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
      <span class="eyebrow">Share</span>
      <h3>手机扫码 · 打开本作品</h3>
      <div class="qr-img">
        <img id="wd-qr-img" alt="作品二维码：长按识别，或保存图片后分享">
      </div>
      <p class="qr-hint"><b>长按二维码</b>识别 · 或保存图片后分享</p>
    </div>
  </div>

  <script>
  (function () {
    var wrap = document.getElementById('wd-share');
    var btn = wrap.querySelector('.wd-share-btn');
    var panel = wrap.querySelector('.wd-share-panel');
    var qrModal = document.getElementById('wd-qr-modal');
    var qrImg = document.getElementById('wd-qr-img');
    var sysBtn = wrap.querySelector('[data-share="system"]');
    var url = location.href;
    function toast(msg) {
      var t = document.createElement('div');
      t.className = 'wd-share-toast';
      t.textContent = msg;
      document.body.appendChild(t);
      setTimeout(function () { t.classList.add('out'); setTimeout(function () { t.remove(); }, 400); }, 1600);
    }
    btn.addEventListener('click', function (e) { e.stopPropagation(); panel.hidden = !panel.hidden; });
    document.addEventListener('click', function (e) { if (!wrap.contains(e.target)) panel.hidden = true; });
    wrap.querySelector('[data-share="copy"]').addEventListener('click', function () {
      var done = function () { toast('链接已复制，去微信粘贴发送即可'); };
      function fb(t) {
        var ta = document.createElement('textarea');
        ta.value = t; ta.style.cssText = 'position:fixed;opacity:0;pointer-events:none';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch (e) {}
        ta.remove();
      }
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(done, function () { fb(url); done(); });
      } else { fb(url); done(); }
      panel.hidden = true;
    });
    wrap.querySelector('[data-share="qrcode"]').addEventListener('click', function () {
      qrImg.src = 'https://api.qrserver.com/v1/create-qr-code/?size=260x260&margin=10&data=' + encodeURIComponent(url);
      qrModal.classList.add('open');
      qrModal.setAttribute('aria-hidden', 'false');
    });
    /* 关闭：点背景 / 关闭钮 / 卡片空白处（图片本身不关闭，便于长按识别/保存） */
    qrModal.addEventListener('click', function (e) {
      if (e.target.closest('[data-qr-close]') || e.target === qrModal || e.target.classList.contains('qr-card')) {
        qrModal.classList.remove('open');
        qrModal.setAttribute('aria-hidden', 'true');
      }
    });
    document.addEventListener('keydown', function (e) {
      if (e.key === 'Escape') {
        qrModal.classList.remove('open');
        qrModal.setAttribute('aria-hidden', 'true');
      }
    });
    if (navigator.share) {
      sysBtn.hidden = false;
      sysBtn.addEventListener('click', function () {
        navigator.share({ title: document.title, url: url }).catch(function () {});
      });
    }
  })();
  </script>
